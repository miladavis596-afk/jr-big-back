<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cookie Clicker</title><link rel="stylesheet" href="styles.css"><style>body{font-family:'Courier New',monospace;background:#141026 url('gaming-room.png') center/cover fixed}.game-page main{background:#fffaf0ed}.goal-list{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.goal{padding:6px;border:1px solid #192238;font-size:11px}.done{background:#8ddd95}.cookie-fall{position:fixed;top:-40px;font-size:25px;animation:fall 5s linear forwards;pointer-events:none}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}.custom{display:none;padding:10px;border:2px dashed #f65078}.custom.show{display:block}</style></head><body class="game-page"><header class="topbar"><a class="logo" href="index.html">BREAK<br><span>TIME ARCADE</span></a><button onclick="shop()">SHOP · <span data-tokens>0</span> TOKENS</button></header><main><a class="back" href="index.html">← All games</a><section class="game-heading"><p class="kicker">COOKIE CLICKER</p><h1>Make it to a million.</h1><p>Every upgrade costs 100 more than the last. Every five upgrades, you can design a cookie.</p></section><section class="game-shell"><div class="stat-row"><span>COOKIES<br><strong id="cookie-count">0</strong></span><span>PER CLICK<br><strong id="per-click">1</strong></span><span>UPGRADES<br><strong id="upgrade-count">0</strong></span></div><div class="cookie-zone"><button id="cookie" class="cookie-button" aria-label="Click cookie">Cookie</button><div class="upgrades"><button id="upgrade" class="upgrade">Upgrade: +1 per click (100 cookies)</button><button id="design" class="upgrade" hidden>Design a cookie (optional)</button><div id="custom" class="custom">Flavor <select><option>Chocolate chip</option><option>Red velvet</option><option>Matcha</option><option>Birthday cake</option></select> Topping <select><option>Sprinkles</option><option>Caramel</option><option>Marshmallows</option><option>Extra chips</option></select></div></div></div><h3>Million-cookie goals</h3><div class="goal-list" id="goals"></div><p class="note" id="cookie-note">Start clicking!</p></section></main><script src="arcade.js"></script><script src="cookie.js"></script></body></html>
